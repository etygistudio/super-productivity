name: Build POCO X3 Personal Release APK

# This branch has a verified 48px MIUI / Android 10 bottom-nav workaround.
# Release APKs are separately installed and always signed by the same private key.
on:
  push:
    branches:
      - fix/android-nav-inset-poco-x3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout patched source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Configure Git for npm dependencies
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            ssh://git@github.com/

      - name: Install dependencies
        run: npm i

      - name: Build production frontend
        run: npm run buildFrontend:prodWeb

      - name: Sync bundled frontend into Android
        run: npm run sync:android

      - name: Configure independently installed POCO release and version
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          gradle_path = Path('android/app/build.gradle')
          gradle = gradle_path.read_text()
          marker = '        release {\n'
          if gradle.count(marker) != 1:
              raise RuntimeError('Expected one release build type')
          gradle = gradle.replace(
              marker,
              marker + '            applicationIdSuffix ".pocorelease"\n',
              1,
          )

          match = re.search(r'\bversionCode\s+([0-9_]+)', gradle)
          if not match:
              raise RuntimeError('Android versionCode missing')
          base_code = int(match.group(1).replace('_', ''))
          build_code = base_code + int(os.environ['BUILD_RUN_NUMBER'])
          if build_code >= 2100000000:
              raise RuntimeError('Android versionCode limit reached')
          gradle = gradle[:match.start(1)] + str(build_code) + gradle[match.end(1):]

          match = re.search(r'\bversionName\s+"([^"]+)"', gradle)
          if not match:
              raise RuntimeError('Android versionName missing')
          new_name = f'{match.group(1)}-poco.{os.environ["BUILD_RUN_NUMBER"]}'
          gradle = gradle[:match.start(1)] + new_name + gradle[match.end(1):]
          gradle_path.write_text(gradle)

          props = Path('android/app/app_config.properties')
          config = props.read_text()
          if 'LAUNCH_MODE=0' not in config:
              raise RuntimeError('Expected LAUNCH_MODE=0 in app_config.properties')
          props.write_text(config.replace('LAUNCH_MODE=0', 'LAUNCH_MODE=2', 1))

          labels = Path('android/app/src/main/res/values/strings.xml')
          xml = labels.read_text()
          xml = xml.replace(
              '<string name="app_name">Super Productivity</string>',
              '<string name="app_name">Super Productivity POCO</string>',
              1,
          ).replace(
              '<string name="title_activity_fullscreen">Super Prod</string>',
              '<string name="title_activity_fullscreen">Super Prod POCO</string>',
              1,
          )
          if 'Super Productivity POCO' not in xml:
              raise RuntimeError('Unable to set unique launcher name')
          labels.write_text(xml)

          # Static Android launcher shortcuts should target the renamed package too.
          shortcuts = Path('android/app/src/main/res/xml/shortcuts.xml')
          shortcut_xml = shortcuts.read_text()
          original = 'android:targetPackage="com.superproductivity.superproductivity"'
          if original not in shortcut_xml:
              raise RuntimeError('Unable to locate shortcut target package')
          shortcuts.write_text(shortcut_xml.replace(
              original,
              'android:targetPackage="com.superproductivity.superproductivity.pocorelease"',
          ))
          print(f'Configured separate personal release build, versionCode={build_code}')
          PY

      - name: Build signed F-Droid release APK
        env:
          POCO_KEYSTORE_BASE64: ${{ secrets.POCO_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.POCO_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: poco-release
          RELEASE_KEY_PASSWORD: ${{ secrets.POCO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$POCO_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Add POCO_KEYSTORE_BASE64 and POCO_KEYSTORE_PASSWORD as repository Actions secrets first."
            exit 1
          fi

          umask 077
          printf '%s' "$POCO_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          keytool -list -keystore keystore.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEYSTORE_ALIAS" > /dev/null

          (cd android && ./gradlew :app:assembleFdroidRelease --no-daemon)

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs \
            android/app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: SuperProductivity-POCO-Personal-Release
          path: android/app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        run: rm -f keystore.jks
