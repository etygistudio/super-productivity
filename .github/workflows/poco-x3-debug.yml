
name: Build POCO X3 Test APK

on:
  push:
    branches:
      - fix/android-nav-inset-poco-x3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Configure Git
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            ssh://git@github.com/

      - name: Install dependencies
        run: npm i

      - name: Build frontend
        run: npm run buildFrontend:stageWeb:unminified

      - name: Sync Android project
        run: npm run sync:android

      - name: Configure test installation
        run: |
          # Install alongside the official app
          sed -i '/^        debug {$/a\            applicationIdSuffix ".pocofix"' android/app/build.gradle

          # Use the bundled offline app
          sed -i 's/^LAUNCH_MODE=0$/LAUNCH_MODE=2/' android/app/app_config.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleFdroidDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SuperProductivity-POCO-X3-Test
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 7
